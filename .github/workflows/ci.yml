name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Upload compiled plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echobrain-local-build
          path: |
            main.js
            manifest.json
            styles.css
