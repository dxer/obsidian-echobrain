<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Card linear gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b2d54" />
      <stop offset="100%" stop-color="#241b35" />
    </linearGradient>

    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c3d2f" />
      <stop offset="100%" stop-color="#13271e" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f3750" />
      <stop offset="100%" stop-color="#122334" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.5px; }
    .subtitle { font-size: 11px; fill: #8b949e; }
    .item-text { font-size: 11px; fill: #c9d1d9; }
    .badge-text { font-size: 9px; font-weight: 600; text-transform: uppercase; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="560" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />

  <!-- ==================== TOP: Obsidian Vault & Interactive Layer ==================== -->
  <g transform="translate(180, 20)" filter="url(#shadow)">
    <rect width="600" height="68" rx="8" fill="url(#vaultGrad)" stroke="#8957e5" stroke-width="1.5" />
    <circle cx="32" cy="34" r="15" fill="#8957e5" fill-opacity="0.2" stroke="#ab7df8" stroke-width="1" />
    <path d="M 26 29 L 38 29 M 26 34 L 38 34 M 26 39 L 34 39" stroke="#d2a8ff" stroke-width="1.8" stroke-linecap="round" />
    <text x="60" y="30" class="title" fill="#d2a8ff">Obsidian Markdown Vault &amp; 写作交互层 (Local-First Core)</text>
    <text x="60" y="48" class="subtitle">原生双链 [[WikiLinks]] | @@ 写作伴随悬浮补全 | 孤岛雷达自愈 (Auto-Rescue) | Inbox 隔离沉淀</text>
  </g>

  <!-- Connecting Lines from Vault to Processing Layers -->
  <path d="M 330 88 L 330 115 L 240 115 L 240 128" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-blue)" />
  <path d="M 630 88 L 630 115 L 720 115 L 720 128" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />

  <!-- ==================== MIDDLE LAYER: Dual Processing & Storage ==================== -->
  <!-- Left Box: Content Semantic & SQLite WASM Storage -->
  <g transform="translate(50, 130)" filter="url(#shadow)">
    <rect width="410" height="150" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="410" height="32" rx="8" fill="#182330" />
    <rect x="0" y="24" width="410" height="8" fill="#182330" />
    <text x="16" y="21" class="title" fill="#58a6ff">1. 内容检索与 SQLite WASM 存储底座</text>
    
    <g transform="translate(16, 44)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3" fill="#58a6ff" />
      <text x="16" y="10" class="item-text"><tspan font-weight="600" fill="#f0f6fc">SQLite WASM 底座</tspan>: .echobrain/echobrain.db 单条原子 CRUD + WAL 落盘</text>
      <!-- Item 2 -->
      <circle cx="6" cy="30" r="3" fill="#58a6ff" />
      <text x="16" y="34" class="item-text"><tspan font-weight="600" fill="#f0f6fc">Float32 BLOB 向量直存</tspan>: 2KB 二进制连续内存，SIMD 硬件余弦加速</text>
      <!-- Item 3 -->
      <circle cx="6" cy="54" r="3" fill="#58a6ff" />
      <text x="16" y="58" class="item-text"><tspan font-weight="600" fill="#f0f6fc">TF-IDF 动态降噪</tspan>: 过滤全库超 70% 通用虚词，支持 CamelCase 驼峰切词</text>
      <!-- Item 4 -->
      <circle cx="6" cy="78" r="3" fill="#58a6ff" />
      <text x="16" y="82" class="item-text"><tspan font-weight="600" fill="#f0f6fc">双模 Dense Embedding</tspan>: 纯离线 40MB ONNX 模型 / OpenAI API 双选</text>
    </g>
  </g>

  <!-- Right Box: Topology & LinkGraph Engine -->
  <g transform="translate(500, 130)" filter="url(#shadow)">
    <rect width="410" height="150" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="410" height="32" rx="8" fill="#241b35" />
    <rect x="0" y="24" width="410" height="8" fill="#241b35" />
    <text x="16" y="21" class="title" fill="#bc8cff">2. 关系图谱与拓扑中枢 (Topology &amp; Graph)</text>
    
    <g transform="translate(16, 44)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3" fill="#bc8cff" />
      <text x="16" y="10" class="item-text"><tspan font-weight="600" fill="#f0f6fc">物理双链拓扑</tspan>: 挂载原生 resolvedLinks，即时解析出链与反向链接 (Backlinks)</text>
      <!-- Item 2 -->
      <circle cx="6" cy="30" r="3" fill="#bc8cff" />
      <text x="16" y="34" class="item-text"><tspan font-weight="600" fill="#f0f6fc">迭代 PageRank 算法</tspan>: 20轮阻尼计算，自动识别 MOC 核心母笔记权重</text>
      <!-- Item 3 -->
      <circle cx="6" cy="54" r="3" fill="#bc8cff" />
      <text x="16" y="58" class="item-text"><tspan font-weight="600" fill="#f0f6fc">高阶共现拓扑</tspan>: 深度推导共同引用 (Co-citations) 与共同反链兄弟节点</text>
      <!-- Item 4 -->
      <circle cx="6" cy="78" r="3" fill="#bc8cff" />
      <text x="16" y="82" class="item-text"><tspan font-weight="600" fill="#f0f6fc">BFS 邻域漫游</tspan>: 1-Hop / 2-Hop 关联网络自动打包注入大模型上下文</text>
    </g>
  </g>

  <!-- Connecting Lines from Processing to Fusion Engine -->
  <path d="M 255 280 L 255 298 L 390 298 L 390 310" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 705 280 L 705 298 L 570 298 L 570 310" fill="none" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- ==================== GRAPH-RAG CORE FUSION ==================== -->
  <g transform="translate(160, 312)" filter="url(#shadow)">
    <rect width="640" height="58" rx="8" fill="url(#ragGrad)" stroke="#2ea043" stroke-width="1.5" />
    <circle cx="28" cy="29" r="14" fill="#2ea043" fill-opacity="0.2" stroke="#3fb950" stroke-width="1" />
    <path d="M 23 29 L 27 33 L 34 24" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="26" class="title" fill="#3fb950">Graph-RAG 复合融合决策中枢 (Hybrid Multi-Signal Ranking &amp; Fusion)</text>
    <text x="54" y="44" class="subtitle">综合得分 = RRF(Rank_BM25, Rank_Vector) × (1 + α · PageRank) × 时序因子 + 拓扑上下文</text>
  </g>

  <!-- Line from Graph-RAG to MCP Layer -->
  <path d="M 480 370 L 480 398" fill="none" stroke="#3fb950" stroke-width="1.5" />
  <path d="M 480 398 L 250 398 L 250 410" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 480 398 L 710 398 L 710 410" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ==================== BOTTOM LAYER: MCP Server & Agent Ecosystem ==================== -->
  <!-- Left Box: MCP Protocol Full Specification -->
  <g transform="translate(50, 412)" filter="url(#shadow)">
    <rect width="410" height="126" rx="8" fill="url(#cardGrad)" stroke="#f0883e" stroke-width="1.2" />
    <rect x="0" y="0" width="410" height="28" rx="8" fill="#2d1f16" />
    <rect x="0" y="20" width="410" height="8" fill="#2d1f16" />
    <text x="14" y="19" class="title" fill="#f0883e">内嵌 MCP 协议中枢 (Embedded MCP Server :23333)</text>
    <text x="14" y="48" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">8 大核心工具 (Tools)</tspan>: 检索/织网/巡检/解救孤岛/图谱探查/读取</text>
    <text x="14" y="68" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">3 大动态资源 (Resources)</tspan>: 全局统计 / 核心母笔记 / 收件箱</text>
    <text x="14" y="88" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">2 大预设工作流 (Prompts)</tspan>: 会话洞察沉淀 / 知识库深度代码审查</text>
    <text x="14" y="108" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">安全防护</tspan>: Local Bearer Token 访问控制，防止未授权跨站调用</text>
  </g>

  <!-- Right Box: AI Agent Ecosystem -->
  <g transform="translate(500, 412)" filter="url(#shadow)">
    <rect width="410" height="126" rx="8" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.2" />
    <rect x="0" y="0" width="410" height="28" rx="8" fill="#14233a" />
    <rect x="0" y="20" width="410" height="8" fill="#14233a" />
    <text x="14" y="19" class="title" fill="#58a6ff">现代 AI Agent 生态无缝直连 (Streamable HTTP / SSE)</text>
    <text x="14" y="48" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">Cursor 极速连接</tspan>: 原生 Streamable HTTP 协议，即问即查</text>
    <text x="14" y="68" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">Claude Desktop / WorkBuddy</tspan>: 经典 HTTP-SSE 长期会话直通</text>
    <text x="14" y="88" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">单进程共享常驻</tspan>: 零外部 Docker / Python 进程膨胀</text>
    <text x="14" y="108" class="item-text">• <tspan font-weight="600" fill="#f0f6fc">知识进化闭环</tspan>: Agent 自动将提炼成果安全沉淀并反哺双链图谱</text>
  </g>
</svg>
